# The hole recipe (NEXT_STEPS.md, plan of 2026-11-23; docs/holes_recipe.png): the normal 0.6B H-Net
# (= rdiag/h_base, the config and seed of side-p06-plain-s0) + the loop trained in 4 parallel rounds with 15% plain
# single-round updates + about 10% of words deleted (runs of 1-3), one marker byte (3) per deleted word, the marker's
# slot fed only by the loop. latents/models.py (feedback, holes), latents/holes.py, latents/health.py.
base: rdiag/h_base.yaml
group: holes
model:
  feedback: {passes: 4, plain_frac: 0.15}
  holes: {mark: 3}
train:
  eval_every: 250
  holes: {rate: 0.1, max_run: 3}
  hole_eval_windows: 64
